# Chạy test mỗi lần push. Test dùng dữ liệu BỊA trong tests/conftest.py nên
# không cần credential và không đụng dữ liệu khách.
#
# Job chạy pipeline hằng ngày sẽ thêm ở tuần 3, khi có io_sheets.py và
# Service Account — hiện chưa có nguồn dữ liệu nào mà CI đọc được.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v
